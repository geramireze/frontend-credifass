<div class="p-4 md:p-8 max-w-2xl mx-auto">

  <a routerLink="/credifass/productos"
     class="inline-flex items-center gap-1.5 text-sm text-app-muted-fg hover:text-app-fg mb-6">
    <app-icon name="chevron-left" [size]="14" />
    Volver a inventario
  </a>

  <div class="page-header">
    <h1 class="page-title">Nuevo producto</h1>
  </div>

  @if (error()) {
    <div role="alert" class="alert-error mb-6">
      <app-icon name="alert-circle" [size]="16" class="shrink-0" />
      <span>{{ error() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="card p-6 space-y-5">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <!-- Nombre -->
        <div class="sm:col-span-2">
          <label class="app-label" for="nombre">Nombre del producto *</label>
          <input id="nombre" type="text" formControlName="nombre" class="app-input"
                 [class.border-status-error]="campo('nombre')"
                 placeholder="Ej. Camiseta talla M" />
          @if (campo('nombre')) {
            <p class="text-xs text-status-error-fg mt-1">Requerido (mín. 2 caracteres)</p>
          }
        </div>

        <!-- Categoría -->
        <div>
          <label class="app-label" for="cat">Categoría</label>
          <select id="cat" formControlName="categoriaId" class="app-input">
            <option value="">Sin categoría</option>
            @for (c of categorias(); track c.id) {
              <option [value]="c.id">{{ c.nombre }}</option>
            }
          </select>
        </div>

        <!-- Valor compra -->
        <div>
          <label class="app-label" for="vc">Valor de compra (COP) *</label>
          <input id="vc" type="number" min="0" formControlName="valorCompra" class="app-input"
                 [class.border-status-error]="campo('valorCompra')"
                 placeholder="0" />
          @if (campo('valorCompra')) {
            <p class="text-xs text-status-error-fg mt-1">Valor numérico requerido</p>
          }
        </div>

        <!-- Valor venta -->
        <div>
          <label class="app-label" for="vv">Valor de venta (COP) *</label>
          <input id="vv" type="number" min="0" formControlName="valorVenta" class="app-input"
                 [class.border-status-error]="campo('valorVenta')"
                 placeholder="0" />
          @if (campo('valorVenta')) {
            <p class="text-xs text-status-error-fg mt-1">Valor numérico requerido</p>
          }
        </div>

        <!-- Stock inicial -->
        <div>
          <label class="app-label" for="stock">Stock inicial</label>
          <input id="stock" type="number" min="0" formControlName="stockInicial" class="app-input" />
          <p class="text-xs text-gray-500 mt-1">Unidades que ingresan al inventario hoy</p>
        </div>

        <!-- Descripción -->
        <div class="sm:col-span-2">
          <label class="app-label" for="desc">Descripción</label>
          <textarea id="desc" formControlName="descripcion" rows="3"
                    class="app-input resize-none"
                    placeholder="Detalles adicionales del producto…"></textarea>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" [disabled]="guardando()"
                class="btn-primary flex-1 sm:flex-none disabled:opacity-50">
          {{ guardando() ? 'Guardando…' : 'Crear producto' }}
        </button>
        <a routerLink="/credifass/productos" class="btn-secondary flex-1 sm:flex-none text-center">
          Cancelar
        </a>
      </div>

    </div>
  </form>
</div>
