@if (visible()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4 bg-black/40 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="pwa-update-title"
  >
    <div class="w-full sm:max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden animate-slide-up">

      <!-- Header -->
      <div class="bg-indigo-600 px-5 py-4 flex items-center gap-3">
        <div class="flex-shrink-0 w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0
                     0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </div>
        <div>
          <p id="pwa-update-title" class="text-sm font-bold text-white leading-tight">
            Nueva versión disponible
          </p>
          <p class="text-xs text-indigo-200 mt-0.5 tabular-nums">
            Versión en caché: {{ version }}
          </p>
        </div>
      </div>

      <!-- Body -->
      <div class="px-5 py-5 space-y-4">
        <p class="text-sm text-gray-600 leading-relaxed">
          Hay una actualización de <strong class="text-gray-800">CrediFass</strong> lista para
          instalar. Se limpiarán los archivos en caché y la app se recargará con la versión más reciente.
        </p>

        <div class="flex flex-col gap-2">
          <button
            (click)="actualizar()"
            [disabled]="actualizando()"
            class="w-full h-11 rounded-xl bg-indigo-600 text-white text-sm font-semibold
                   hover:bg-indigo-700 disabled:opacity-60 transition-colors
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
          >
            {{ actualizando() ? 'Actualizando…' : 'Actualizar ahora' }}
          </button>
          <button
            (click)="dismiss()"
            [disabled]="actualizando()"
            class="w-full h-11 rounded-xl border border-gray-200 text-gray-600 text-sm
                   hover:bg-gray-50 disabled:opacity-60 transition-colors
                   focus:outline-none focus:ring-2 focus:ring-gray-400"
          >
            Recordarme después
          </button>
        </div>
      </div>

    </div>
  </div>
}
